function fitCards(){document.querySelectorAll('.cb').forEach(el=>{el.style.setProperty('--s',(el.offsetWidth/252).toFixed(4));
 const tab=el.querySelector('.rtab'),body=el.querySelector('.rbody2'),tn=el.querySelector('.rtn');if(!tab||!tn)return;
 const lim=body?body.offsetTop-tab.offsetTop-10:330-tab.offsetTop;let f=18;tn.style.fontSize=f+'px';
 while(tab.offsetHeight>lim&&f>12){f-=.5;tn.style.fontSize=f+'px';}});}
window.addEventListener('resize',()=>fitCards());
const FS_OK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const FSKEY='radlands2_fs_v1';UI.autoFS=lsGet(FSKEY)!=='0';
function saveFSPref(){lsSet(FSKEY,UI.autoFS?'1':'0');}
function enterFS(){try{const el=document.documentElement;const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{});}catch(e){}}
function autoFS(e){if(FS_OK&&UI.autoFS&&!isFS()&&!UI.quit&&!(e.target.closest&&e.target.closest('[data-act=fs],[data-act=autofs],[data-act=quit],input')))enterFS();}

const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function lockPortrait(){try{if(isFS()&&screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}
document.addEventListener('fullscreenchange',()=>setTimeout(lockPortrait,100));
function toggleFS(){try{if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const el=document.documentElement;const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{});}}catch(e){}}
document.addEventListener('fullscreenchange',()=>render());document.addEventListener('webkitfullscreenchange',()=>render());
/* ===================== OVLÁDÁNÍ ===================== */
function sndHTML(){const row=(k,on,ic,n,vk)=>`<div class="sp-row ${on?'':'off'}"><label class="sw2"><input type="checkbox" data-act="sw" data-arg="${k}" ${on?'checked':''}><span></span></label><span class="sp-n">${ic} ${n}</span>${vk?`<input type="range" min="0" max="100" value="${SET[vk]}" data-snd="${vk}"><span class="sp-val" id="v-${vk}">${SET[vk]} %</span>`:'<span></span><span></span>'}</div>`;
 return `<div class="sheet-bg"><div class="sheet sndsheet"><div class="dname">🔊 Zvuk a efekty</div>${row('mOn',SET.mOn,'🔊','Všechny zvuky','mV')}${row('sfx',SET.sfx,'💥','Herní efekty','eV')}${row('muOn',SET.muOn,'🎵','Hudba','muV')}${row('amOn',SET.amOn,'🌵','Zvuky pustiny','aV')}${row('anim',SET.anim,'✨','Animace',null)}
 <div class="mstyle"><b>Hudba:</b>${[['auto','🔄 Automaticky'],...Object.entries(MSTY).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="chipb ${SET.mus===k?'on':''}" data-act="musStyle" data-arg="${k}">${n}</button>`).join('')}</div><div class="ln" style="font-size:13px;opacity:.75">Automaticky: v menu klid u ohně, ve tvém tahu rock, v tahu Automy napětí.</div><div class="ctrl"><button class="btn sec" data-act="sndReset">Výchozí</button><button class="btn" data-act="sndClose">Hotovo</button></div></div></div>`;}
function resolvePrompt(o){const r=G.prompt.res;G.prompt=null;G.detail=null;render();r(o);}
document.addEventListener('input',e=>{const sk=e.target.dataset&&e.target.dataset.snd;if(sk){SET[sk]=+e.target.value;if(SET[sk]>0){SET[{mV:'mOn',eV:'sfx',muV:'muOn',aV:'amOn'}[sk]]=true;}saveSet();busGains();audioUpdate();const v=document.getElementById('v-'+sk);if(v)v.textContent=SET[sk]+' %';return;}const n=e.target.dataset&&e.target.dataset.name;if(n){UI[n]=e.target.value.trim();saveNames();}});
document.addEventListener('change',e=>{const sk=e.target.dataset&&e.target.dataset.snd;if(sk){if(!ac())return;busGains();audioUpdate();if(sk==='aV'){try{aCrow();}catch(x){}}else if(sk!=='muV')sfx('hit');}});
document.addEventListener('pointerdown',()=>{if(SET.mOn&&(SET.sfx||SET.muOn||SET.amOn)){if(ac())audioUpdate();}},true);
document.addEventListener('visibilitychange',()=>audioUpdate());
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn'))sfx('click');if(e.target.closest('input[data-name]'))return;const a=e.target.closest('[data-act]');
 if(a){const act_=a.dataset.act,arg=a.dataset.arg;handle(act_,arg,a);return;}
 const k=e.target.closest('[data-k]');if(k&&G){const key=k.dataset.k;if(G.prompt){const o=G.prompt.options.find(o=>o.ref&&keyOf(o.ref)===key);if(o&&o.ref.t!=='hand'){resolvePrompt(o);return;}}G.detail=key;render();return;}
 if(e.target.classList.contains('sheet-bg')){if(G)G.detail=null;UI.rules=false;UI.log=false;UI.snd=false;UI.disc=false;UI.upd=false;UI.players=false;if(!UPD.busy)UI.updAsk=false;render();}});
function handle(a,arg,el){const g=G;const p=g?g.cur:0;
 switch(a){
 case 'newAI':newGame('ai');break;case 'newHot':newGame('hot');break;
 case 'starter':UI.starter=el.checked;break;
 case 'rules':UI.rules=true;UI.rpage=UI.rpage||0;render();break;case 'closeRules':UI.rules=false;render();break;
 case 'upd':UI.upd=true;render();break;case 'updClose':UI.upd=false;render();break;case 'updCheck':checkUpdate(true);break;case 'updShow':UI.upd=false;UI.updAsk=true;render();break;
 case 'updAuto':UPDS.auto=el.checked;saveUpd();break;case 'updGo':doUpdate();break;case 'updLater':UI.updAsk=false;render();break;case 'updSkip':UPDS.skip=UPD.info?UPD.info.version:'';saveUpd();UI.updAsk=false;render();break;
 case 'log':UI.log=true;UI.mlog=false;render();break;case 'mlog':UI.mlog=!UI.mlog;render();break;case 'mlClose':UI.mlog=false;render();break;
 case 'disc':UI.disc=0;UI.mlog=false;render();break;case 'discSel':UI.disc=+arg;render();break;case 'discClose':UI.disc=false;render();break;case 'closeLog':UI.log=false;render();break;
 case 'menu':if(G)saveGame(G);UI.screen='menu';UI.log=false;UI.mlog=false;UI.disc=false;G=null;render();break;
 case 'resume':resumeGame();break;
 case 'tSfx':SET.sfx=!SET.sfx;saveSet();render();sfx('turn');break;
 case 'snd':UI.snd=true;render();break;
 case 'sndClose':UI.snd=false;render();break;
 case 'musStyle':SET.mus=arg;saveSet();if(ac()){musStop();busGains();audioUpdate();}render();break;
 case 'sndReset':Object.assign(SET,{sfx:true,anim:true,mOn:true,mV:90,eV:70,muOn:true,muV:50,amOn:true,aV:60,mus:'auto'});saveSet();busGains();audioUpdate();render();sfx('turn');break;
 case 'sw':SET[arg]=el.checked;saveSet();if(ac()){busGains();audioUpdate();}render();if(el.checked&&(arg==='sfx'||arg==='mOn'))sfx('turn');if(el.checked&&arg==='amOn'){try{aCrow();}catch(x){}}break;
 case 'tAnim':SET.anim=!SET.anim;saveSet();render();break;
 case 'starterT':UI.starter=!UI.starter;render();break;case 'players':UI.players=true;render();break;case 'playersClose':UI.players=false;render();break;
 case 'rpg':UI.rpage=Math.max(0,Math.min(RPAGES.length-1,(UI.rpage||0)+(+arg)));UI.rdir=+arg;render();break;case 'rgo':UI.rdir=(+arg>(UI.rpage||0))?1:-1;UI.rpage=+arg;render();break;
 case 'fs':toggleFS();break;
 case 'autofs':UI.autoFS=el.checked;saveFSPref();if(UI.autoFS)enterFS();else if(isFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);break;
 case 'quit':quitGame();break;
 case 'unquit':UI.quit=false;render();break;
 case 'delsave':lsDel(SKEY);render();break;
 case 'closeDetail':g.detail=null;render();break;
 case 'pass':{const r=g.pass.res;g.pass=null;render();r();break;}
 case 'pickT':{const s=g.pick.sel;const i=s.indexOf(arg);if(i>=0)s.splice(i,1);else if(s.length<3)s.push(arg);render();break;}
 case 'pickOK':{const pk=g.pick;if(pk.sel.length!==3)return;g.pick=null;render();pk.res(pk.sel.slice());break;}
 case 'opt':resolvePrompt(g.prompt.options[+arg]);break;
 case 'skip':resolvePrompt(null);break;
 case 'end':if(myActionTime(g))act(()=>endTurn(g));break;
 case 'drawPaid':if(myActionTime(g))act(async()=>drawPaid(g,p));break;
 case 'silo':if(myActionTime(g))act(async()=>takeSilo(g,p));break;
 case 'play':{const h=g.pl[p].hand.find(h=>h.uid===+arg);if(h&&myActionTime(g))act(()=>playCard(g,p,h));break;}
 case 'junk':{const h=g.pl[p].hand.find(h=>h.uid===+arg);if(h&&myActionTime(g))act(()=>junkCard(g,p,h));break;}
 case 'ab':{const[k,i]=arg.split('|');const I=infoByKey(g,k);if(I&&myActionTime(g))act(()=>useAbility(g,p,I.ref,+i));break;}
 }}
sceneInit();render();if(typeof location==='undefined'||!/[?&]nosplash/.test(location.search||''))splashShow();
if('serviceWorker' in navigator&&IS_WEB){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{UPD.reg=r;if(UPDS.auto)setTimeout(()=>checkUpdate(false),1500);}).catch(()=>{});});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(UPD.state==='updating')location.reload();});}
</script>
